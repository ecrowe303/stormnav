<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StormNav">
<meta name="theme-color" content="#0a0c10">
<title>StormNav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --panel: #161a22;
    --border: #1e2430;
    --accent: #00e5ff;
    --accent2: #ff6b35;
    --warn: #ffcc00;
    --danger: #ff3b3b;
    --ok: #00e676;
    --text: #e8eaf0;
    --muted: #5a6070;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --safe-top: env(safe-area-inset-top, 44px);
    --safe-bottom: env(safe-area-inset-bottom, 20px);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    background:var(--bg); color:var(--text);
    font-family:var(--font-mono);
    height:100%; overflow:hidden;
    display:flex; flex-direction:column;
    position:fixed; width:100%;
  }
  .safe-top { height:var(--safe-top); background:var(--surface); flex-shrink:0; }

  /* HEADER */
  .app-header {
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:0 16px; height:56px;
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0; z-index:100;
  }
  .logo { font-family:var(--font-display); font-weight:800; font-size:1.2rem; color:var(--accent); display:flex; align-items:center; gap:6px; }
  .logo span { color:var(--text); }
  .header-right { display:flex; align-items:center; gap:10px; }
  .gps-pill { display:flex; align-items:center; gap:5px; background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:5px 10px; font-size:0.6rem; color:var(--muted); cursor:pointer; min-height:32px; }
  .gps-dot { width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 5px var(--ok); animation:pulse 2s infinite; flex-shrink:0; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .header-time { font-size:0.65rem; color:var(--muted); }

  /* CONTENT */
  .app-content { flex:1; overflow:hidden; position:relative; min-height:0; }
  .tab-view { position:absolute; inset:0; display:none; flex-direction:column; overflow:hidden; }
  .tab-view.active { display:flex; }

  /* MAP */
  #mapEl { width:100%; height:100%; position:absolute; inset:0; }

  /* Floating search bar */
  .map-search-bar {
    position:absolute; top:12px; left:12px; right:12px; z-index:500;
    display:flex; gap:8px; align-items:center;
  }
  .map-search-input {
    flex:1; background:rgba(17,19,24,0.93);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--border); border-radius:12px;
    padding:13px 14px; color:var(--text);
    font-family:var(--font-mono); font-size:0.8rem; outline:none;
    min-height:46px;
  }
  .map-search-input::placeholder { color:var(--muted); }
  .map-fab {
    background:var(--accent); border:none; border-radius:12px;
    width:46px; height:46px; font-size:1.2rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:0 4px 16px rgba(0,229,255,0.3);
  }
  .map-fab:active { opacity:0.7; transform:scale(0.95); }

  /* Map right controls */
  .map-controls-right {
    position:absolute; right:12px; bottom:12px; z-index:400;
    display:flex; flex-direction:column; gap:8px;
  }
  .map-icon-btn {
    width:46px; height:46px;
    background:rgba(17,19,24,0.93);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--border); border-radius:12px;
    color:var(--text); font-size:1.2rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .map-icon-btn:active { opacity:0.6; }
  .map-icon-btn.active { border-color:var(--accent); }

  /* BOTTOM SHEET */
  .map-bottom-sheet {
    background:var(--surface); border-top:1px solid var(--border);
    border-radius:20px 20px 0 0;
    padding:0 16px 12px;
    flex-shrink:0; max-height:65vh; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .map-bottom-sheet::-webkit-scrollbar { display:none; }
  .sheet-handle { width:36px; height:4px; background:var(--border); border-radius:2px; margin:10px auto 14px; }

  /* Route inputs */
  .input-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .input-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .dot-start { background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .dot-end { background:var(--accent2); box-shadow:0 0 6px var(--accent2); }
  .route-input {
    flex:1; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:12px 14px; color:var(--text);
    font-family:var(--font-mono); font-size:0.8rem; outline:none;
    min-height:46px; -webkit-appearance:none;
  }
  .route-input:focus { border-color:var(--accent); }
  .route-input::placeholder { color:var(--muted); }
  .connector-stub { width:10px; display:flex; justify-content:center; flex-shrink:0; }
  .connector-line { width:1px; height:18px; background:var(--border); }

  /* Buttons */
  .btn-row { display:flex; gap:8px; margin-bottom:14px; margin-top:4px; }
  .btn-primary {
    flex:1; background:var(--accent); color:#000; border:none;
    border-radius:12px; padding:14px; font-family:var(--font-mono);
    font-weight:700; font-size:0.8rem; letter-spacing:0.05em;
    cursor:pointer; min-height:48px; -webkit-appearance:none;
  }
  .btn-primary:active { opacity:0.75; transform:scale(0.98); }
  .btn-sq {
    background:var(--panel); color:var(--muted); border:1px solid var(--border);
    border-radius:12px; width:48px; min-height:48px; font-size:1.1rem;
    cursor:pointer; -webkit-appearance:none; display:flex; align-items:center; justify-content:center;
  }
  .btn-sq:active { opacity:0.6; }

  /* Route options */
  .section-label { font-family:var(--font-display); font-size:0.6rem; font-weight:600; letter-spacing:0.15em; color:var(--muted); text-transform:uppercase; margin-bottom:10px; }
  .route-options { display:flex; flex-direction:column; gap:8px; }
  .route-option {
    background:var(--panel); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; cursor:pointer;
    display:flex; align-items:center; gap:12px;
    min-height:68px;
  }
  .route-option:active { opacity:0.75; }
  .route-option.selected { border-width:2px; }
  .route-color-bar { width:4px; height:44px; border-radius:2px; flex-shrink:0; }
  .route-option-info { flex:1; min-width:0; }
  .route-option-name { font-family:var(--font-display); font-size:0.8rem; font-weight:700; color:var(--text); }
  .route-option-tag { font-size:0.65rem; color:var(--muted); font-weight:400; }
  .route-option-stats { font-size:0.65rem; color:var(--muted); margin:3px 0 5px; display:flex; gap:12px; }
  .route-badge { font-size:0.6rem; padding:3px 8px; border-radius:20px; font-weight:700; display:inline-block; }
  .badge-clear { background:rgba(0,230,118,0.15); color:var(--ok); }
  .badge-warn { background:rgba(255,204,0,0.15); color:var(--warn); }
  .badge-danger { background:rgba(255,59,59,0.15); color:var(--danger); }
  .badge-checking { background:rgba(90,96,112,0.2); color:var(--muted); }
  .route-chevron { color:var(--muted); font-size:1.1rem; }

  /* START NAV button — large, prominent */
  .start-nav-btn {
    width:100%; background:var(--ok); color:#000; border:none;
    border-radius:14px; padding:16px; font-family:var(--font-mono);
    font-weight:700; font-size:0.85rem; letter-spacing:0.05em;
    cursor:pointer; margin-top:12px; margin-bottom:4px;
    min-height:52px; -webkit-appearance:none;
    box-shadow:0 4px 20px rgba(0,230,118,0.25);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .start-nav-btn:active { opacity:0.75; transform:scale(0.98); }
  .start-nav-btn.hidden { display:none; }

  /* Nav bar */
  .nav-bar { background:var(--panel); border-top:1px solid var(--border); padding:12px 16px; display:none; flex-shrink:0; }
  .nav-bar.active { display:block; }
  .nav-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .nav-label { font-family:var(--font-display); font-size:0.75rem; font-weight:700; color:var(--ok); }
  .nav-stop {
    background:rgba(255,59,59,0.15); color:var(--danger); border:1px solid var(--danger);
    border-radius:8px; padding:6px 14px; font-family:var(--font-mono);
    font-size:0.65rem; cursor:pointer; min-height:34px;
  }
  .progress-track { background:var(--border); border-radius:3px; height:3px; margin-bottom:10px; }
  .progress-fill { height:100%; background:linear-gradient(90deg, var(--accent), var(--ok)); border-radius:3px; transition:width 0.5s; width:0%; }
  .nav-turn { display:flex; align-items:center; gap:10px; }
  .turn-icon { font-size:1.8rem; flex-shrink:0; min-width:36px; }
  .turn-text { font-size:0.78rem; color:var(--text); }
  .turn-sub { font-size:0.62rem; color:var(--accent); margin-top:3px; }

  /* WEATHER TAB */
  .weather-scroll { flex:1; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch; }
  .weather-scroll::-webkit-scrollbar { display:none; }
  .sec-title { font-family:var(--font-display); font-size:0.6rem; font-weight:600; letter-spacing:0.15em; color:var(--muted); text-transform:uppercase; margin-bottom:10px; margin-top:16px; }
  .sec-title:first-child { margin-top:0; }
  .weather-hero { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px; display:flex; align-items:center; justify-content:space-between; }
  .hero-temp { font-family:var(--font-display); font-size:3rem; font-weight:800; line-height:1; }
  .hero-desc { font-size:0.75rem; color:var(--muted); margin-top:4px; }
  .hero-feels { font-size:0.65rem; color:var(--muted); margin-top:2px; }
  .hero-icon { font-size:3.5rem; }
  .wstats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .wstat { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; text-align:center; }
  .wstat-icon { font-size:1.2rem; margin-bottom:4px; }
  .wstat-val { font-family:var(--font-display); font-size:0.95rem; font-weight:700; }
  .wstat-key { font-size:0.58rem; color:var(--muted); text-transform:uppercase; margin-top:2px; }
  .alert-card { border-radius:12px; padding:12px 14px; margin-bottom:8px; border-left:3px solid; display:flex; align-items:flex-start; gap:10px; }
  .alert-warn { background:rgba(255,204,0,0.08); border-color:#ffcc00; }
  .alert-danger { background:rgba(255,59,59,0.1); border-color:#ff3b3b; }
  .alert-ok { background:rgba(0,230,118,0.07); border-color:#00e676; }
  .alert-icon { font-size:1.1rem; flex-shrink:0; }
  .alert-body {}
  .alert-title { font-family:var(--font-display); font-weight:700; font-size:0.75rem; margin-bottom:2px; }
  .alert-text { font-size:0.68rem; color:var(--muted); line-height:1.5; }
  .forecast-scroll { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .forecast-scroll::-webkit-scrollbar { display:none; }
  .fc-card { flex-shrink:0; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 12px; text-align:center; min-width:68px; }
  .fc-time { font-size:0.6rem; color:var(--muted); margin-bottom:5px; }
  .fc-icon { font-size:1.3rem; margin-bottom:4px; }
  .fc-temp { font-size:0.8rem; font-weight:700; }
  .fc-precip { font-size:0.6rem; color:#7ecfff; margin-top:3px; }

  /* TAB BAR */
  .tab-bar {
    background:rgba(17,19,24,0.96); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--border);
    display:flex; flex-shrink:0;
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .tab-btn {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; background:none; border:none; cursor:pointer; padding:10px 0;
    min-height:56px; -webkit-tap-highlight-color:transparent; -webkit-appearance:none;
  }
  .tab-btn:active { opacity:0.5; }
  .tab-icon { font-size:1.4rem; }
  .tab-label { font-family:var(--font-mono); font-size:0.58rem; color:var(--muted); letter-spacing:0.05em; }
  .tab-btn.active .tab-label { color:var(--accent); }

  /* LOADING */
  .loading-overlay { position:fixed; inset:0; background:rgba(10,12,16,0.85); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:9000; }
  .loading-overlay.active { display:flex; }
  .loading-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px 32px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .loading-text { font-size:0.7rem; color:var(--muted); }

  /* TOAST */
  .toast-container { position:fixed; top:calc(var(--safe-top) + 70px); left:16px; right:16px; z-index:9999; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .toast { background:rgba(22,26,34,0.96); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:12px; padding:10px 16px; font-size:0.72rem; color:var(--text); max-width:320px; text-align:center; animation:toastIn 0.3s ease; transition:opacity 0.4s; box-shadow:0 8px 24px rgba(0,0,0,0.4); }
  @keyframes toastIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:none} }

  /* LEAFLET */
  .leaflet-container { background:#0d1117 !important; }
  .leaflet-tile { filter:brightness(0.85) saturate(0.8); }
  .leaflet-control-zoom { display:none; }
  .storm-pulse { width:40px; height:40px; border-radius:50%; background:rgba(255,59,59,0.2); border:2px solid #ff3b3b; animation:stormPulse 1.5s ease-out infinite; }
  @keyframes stormPulse { 0%{transform:scale(1);opacity:1} 100%{transform:scale(2.5);opacity:0} }
  .placeholder-msg { color:var(--muted); font-size:0.72rem; text-align:center; padding:24px 16px; line-height:1.9; }
</style>
</head>
<body>

<div class="safe-top"></div>

<header class="app-header">
  <div class="logo">⛈ Storm<span>Nav</span></div>
  <div class="header-right">
    <!-- GPS pill is itself a button to request location on iOS -->
    <div class="gps-pill" id="gpsPill" onclick="requestLocation()">
      <div class="gps-dot" id="gpsDot"></div>
      <span id="gpsStatus">tap for GPS</span>
    </div>
    <span class="header-time" id="clock"></span>
  </div>
</header>

<div class="app-content">

  <!-- MAP TAB -->
  <div class="tab-view active" id="tabMap">
    <div style="flex:1;position:relative;min-height:0;overflow:hidden">
      <!-- Floating search -->
      <div class="map-search-bar">
        <input class="map-search-input" id="mapDest" placeholder="🔍  Where to?" autocomplete="off" autocorrect="off" spellcheck="false"/>
        <button class="map-fab" onclick="startQuickRoute()">↗</button>
      </div>
      <div id="mapEl" style="position:absolute;inset:0"></div>
      <!-- Map controls — raised above bottom sheet -->
      <div class="map-controls-right" id="mapControlsRight">
        <button class="map-icon-btn active" id="radarBtn" onclick="toggleWeatherLayer()">🌧</button>
        <button class="map-icon-btn" onclick="requestLocation()">📍</button>
      </div>
    </div>

    <!-- BOTTOM SHEET -->
    <div class="map-bottom-sheet" id="mapSheet">
      <div class="sheet-handle"></div>

      <!-- Nav progress (shown during navigation) -->
      <div class="nav-bar" id="navBar">
        <div class="nav-top">
          <span class="nav-label">🟢 NAVIGATING</span>
          <button class="nav-stop" onclick="stopNav()">END ROUTE</button>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="nav-turn">
          <div class="turn-icon" id="turnArrow">↑</div>
          <div>
            <div class="turn-text" id="turnText">Continue on current route</div>
            <div class="turn-sub" id="turnDist">Weather updates live</div>
          </div>
        </div>
      </div>

      <!-- Route search form -->
      <div id="routeForm">
        <div class="input-row">
          <div class="input-dot dot-start"></div>
          <input class="route-input" id="origin" placeholder="From: your location or address" autocomplete="off" autocorrect="off"/>
          <button class="btn-sq" id="myLocBtn" onclick="useMyLocation()">📍</button>
        </div>
        <div class="input-row" style="margin-left:14px;margin-bottom:8px">
          <div class="connector-stub"><div class="connector-line"></div></div>
        </div>
        <div class="input-row">
          <div class="input-dot dot-end"></div>
          <input class="route-input" id="destination" placeholder="To: destination" autocomplete="off" autocorrect="off"/>
        </div>
        <div class="btn-row">
          <button class="btn-primary" onclick="getRoute()">GET ROUTES</button>
          <button class="btn-sq" onclick="clearRoute()" style="font-size:0.9rem">✕</button>
        </div>
      </div>

      <!-- Route options (after search) -->
      <div id="routeOptionsSection" style="display:none">
        <div class="section-label">Choose a Route</div>
        <div class="route-options" id="routeOptions"></div>
        <!-- START NAV — big green button, always visible after routes load -->
        <button class="start-nav-btn" id="startNavBtn" onclick="startNavigation()">
          ▶&nbsp; START NAVIGATION
        </button>
        <button class="btn-primary" onclick="clearRoute()" style="background:var(--panel);color:var(--muted);border:1px solid var(--border);margin-bottom:4px">
          ✕ &nbsp;CLEAR ROUTE
        </button>
      </div>
    </div>
  </div>

  <!-- WEATHER TAB -->
  <div class="tab-view" id="tabWeather">
    <div class="weather-scroll">
      <div class="sec-title">Current Conditions</div>
      <div id="weatherHero">
        <div class="placeholder-msg">Get a route to see<br>live weather conditions ⛅</div>
      </div>
      <div id="wstatsGrid" class="wstats-grid" style="display:none"></div>
      <div id="alertsWrap" style="display:none">
        <div class="sec-title">Alerts</div>
        <div id="alertsList"></div>
      </div>
      <div id="forecastWrap" style="display:none">
        <div class="sec-title">Hourly Forecast</div>
        <div class="forecast-scroll" id="forecastRow"></div>
      </div>
    </div>
  </div>

</div>

<!-- TAB BAR -->
<nav class="tab-bar">
  <button class="tab-btn active" id="tabBtnMap" onclick="switchTab('map')">
    <div class="tab-icon">🗺</div>
    <div class="tab-label">MAP</div>
  </button>
  <button class="tab-btn" id="tabBtnWeather" onclick="switchTab('weather')">
    <div class="tab-icon">⛅</div>
    <div class="tab-label">WEATHER</div>
  </button>
</nav>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Loading...</div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>

<!-- Leaflet at bottom of body so DOM is ready -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
// All functions defined globally so onclick attributes work
// Init runs after DOM is ready

// ── TABS ──
function switchTab(tab) {
  ['map','weather'].forEach(t => {
    document.getElementById('tab'+cap(t)).classList.toggle('active', t===tab);
    document.getElementById('tabBtn'+cap(t)).classList.toggle('active', t===tab);
  });
  if (tab==='map') setTimeout(()=>map.invalidateSize(), 50);
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

// ── MAP ──
const map = L.map('mapEl', { center:[39.8,-98.5], zoom:5, zoomControl:false, maxZoom:21 });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO',
  subdomains: 'abcd',
  maxZoom: 21,
  maxNativeZoom: 19
}).addTo(map);
setTimeout(()=>map.invalidateSize(), 400);

// ── WEATHER RADAR ──
let radarOn=true, radarLayer=null;
async function loadRadar() {
  try {
    const r=await fetch('https://api.rainviewer.com/public/weather-maps.json');
    const d=await r.json();
    const latest=d.radar.past[d.radar.past.length-1];
    if(radarLayer) map.removeLayer(radarLayer);
    if(radarOn) radarLayer=L.tileLayer('https://tilecache.rainviewer.com'+latest.path+'/256/{z}/{x}/{y}/2/1_1.png',{opacity:0.55,zIndex:200}).addTo(map);
  } catch(e){}
}
function toggleWeatherLayer(){
  radarOn=!radarOn;
  document.getElementById('radarBtn').classList.toggle('active',radarOn);
  radarOn ? loadRadar() : (radarLayer && map.removeLayer(radarLayer));
}
setInterval(loadRadar, 300000);

// ── STATE ──
let userLat=null, userLng=null;
let routeLayers=[], allRoutes=[], routeCoords=[];
let startMarker=null, endMarker=null;
let navMode=false, navTimer=null, navWeatherTimer=null, navStep=0;
const COLORS=['#00e5ff','#ff6b35','#a78bfa'];

// ── GPS ──
// iOS Safari REQUIRES geolocation be called from a direct user gesture.
// We never auto-call it on load — only on explicit tap.
function requestLocation() {
  if (!navigator.geolocation) { showToast('GPS not available on this device','warn'); return; }
  document.getElementById('gpsStatus').textContent='locating…';
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      userLat=pos.coords.latitude; userLng=pos.coords.longitude;
      map.setView([userLat,userLng],13);
      document.getElementById('gpsStatus').textContent='active';
      document.getElementById('gpsDot').style.cssText='background:#00e676;box-shadow:0 0 5px #00e676';
      document.getElementById('gpsPill').style.borderColor='#00e676';
      fetchWeather(userLat,userLng);
      showToast('📍 Location found');
    },
    function(err) {
      document.getElementById('gpsStatus').textContent='denied';
      document.getElementById('gpsDot').style.background='#ff3b3b';
      if(err.code===1) showToast('Location permission denied — enable in Settings','warn',5000);
      else showToast('Could not get location','warn');
    },
    { enableHighAccuracy:true, timeout:10000, maximumAge:30000 }
  );
}

function useMyLocation() {
  if(userLat) {
    document.getElementById('origin').value=userLat.toFixed(5)+', '+userLng.toFixed(5);
    showToast('📍 Using your location');
  } else {
    // Request location first, then fill in
    if(!navigator.geolocation){ showToast('GPS not available','warn'); return; }
    document.getElementById('gpsStatus').textContent='locating…';
    navigator.geolocation.getCurrentPosition(
      function(pos){
        userLat=pos.coords.latitude; userLng=pos.coords.longitude;
        document.getElementById('gpsStatus').textContent='active';
        document.getElementById('gpsDot').style.cssText='background:#00e676;box-shadow:0 0 5px #00e676';
        document.getElementById('origin').value=userLat.toFixed(5)+', '+userLng.toFixed(5);
        fetchWeather(userLat,userLng);
        showToast('📍 Location set');
      },
      function(){ showToast('GPS unavailable — type an address','warn'); },
      { enableHighAccuracy:true, timeout:10000 }
    );
  }
}

// ── GEOCODE ──
async function geocode(q) {
  const ll=q.match(/^(-?\d+\.?\d*),\s*(-?\d+\.?\d*)$/);
  if(ll) return { lat:parseFloat(ll[1]), lng:parseFloat(ll[2]), name:q };
  const res=await fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=json&limit=1',{headers:{'Accept-Language':'en'}});
  const data=await res.json();
  if(!data.length) throw new Error('Location not found: '+q);
  return { lat:parseFloat(data[0].lat), lng:parseFloat(data[0].lon), name:data[0].display_name };
}

// ── QUICK ROUTE (from map search bar) ──
async function startQuickRoute() {
  const dest=document.getElementById('mapDest').value.trim();
  if(!dest){ showToast('Enter a destination first','warn'); return; }
  if(!userLat){ showToast('Tap the GPS pill or 📍 to set your location first','warn',4000); return; }
  document.getElementById('origin').value=userLat.toFixed(5)+', '+userLng.toFixed(5);
  document.getElementById('destination').value=dest;
  document.getElementById('mapDest').value='';
  await getRoute();
}

// ── ROUTING ──
async function getRoute() {
  const ov=document.getElementById('origin').value.trim();
  const dv=document.getElementById('destination').value.trim();
  if(!ov||!dv){ showToast('Enter both origin and destination','warn'); return; }
  showLoading('Finding routes…');
  clearRouteLayers();
  try {
    const [start,end]=await Promise.all([geocode(ov),geocode(dv)]);
    setLoadingText('Calculating…');
    const res=await fetch('https://router.project-osrm.org/route/v1/driving/'+start.lng+','+start.lat+';'+end.lng+','+end.lat+'?overview=full&geometries=geojson&steps=true&alternatives=true');
    const data=await res.json();
    if(data.code!=='Ok') throw new Error('Routing failed');
    allRoutes=data.routes.sort((a,b)=>a.duration-b.duration);
    allRoutes.forEach((r,i)=>{
      const coords=r.geometry.coordinates.map(c=>[c[1],c[0]]);
      r._coords=coords;
      const glow=L.polyline(coords,{color:COLORS[i],weight:12,opacity:0.07}).addTo(map);
      const line=L.polyline(coords,{color:COLORS[i],weight:i===0?5:3,opacity:i===0?0.9:0.35,lineJoin:'round'}).addTo(map);
      routeLayers.push({glow,line});
    });
    map.fitBounds(L.latLngBounds(allRoutes.flatMap(r=>r._coords)),{padding:[70,70]});
    if(startMarker) map.removeLayer(startMarker);
    if(endMarker) map.removeLayer(endMarker);
    startMarker=L.circleMarker([start.lat,start.lng],{radius:9,color:'#00e676',fillColor:'#00e676',fillOpacity:1,weight:2}).addTo(map);
    endMarker=L.circleMarker([end.lat,end.lng],{radius:9,color:'#ff6b35',fillColor:'#ff6b35',fillOpacity:1,weight:2}).addTo(map);
    selectRoute(0);
    renderRouteOptions(allRoutes);
    document.getElementById('routeForm').style.display='none';
    document.getElementById('routeOptionsSection').style.display='block';
    setLoadingText('Checking weather…');
    await fetchWeather(start.lat,start.lng);
    allRoutes.forEach((r,i)=>checkRouteWeather(r._coords,i,end));
    hideLoading();
    showToast(allRoutes.length+' route'+(allRoutes.length>1?'s':'')+' found');
  } catch(e) {
    hideLoading();
    showToast('Error: '+e.message,'danger',5000);
  }
}

function renderRouteOptions(routes) {
  const c=document.getElementById('routeOptions');
  c.innerHTML='';
  routes.forEach((r,i)=>{
    const mi=(r.distance*0.000621371).toFixed(1);
    const min=Math.round(r.duration/60);
    const h=Math.floor(min/60), m=min%60;
    const tStr=h>0?h+'h '+m+'m':m+' min';
    const names=['Fastest','Alternate','Third Option'];
    const diff=Math.round((r.duration-routes[0].duration)/60);
    const tag=i===0?'· Recommended':'· +'+diff+' min';
    const el=document.createElement('div');
    el.className='route-option'+(i===0?' selected':'');
    el.id='ro'+i;
    el.style.borderColor=i===0?COLORS[0]:'#1e2430';
    el.onclick=function(){ selectRoute(i); };
    el.innerHTML='<div class="route-color-bar" style="background:'+COLORS[i]+'"></div>'
      +'<div class="route-option-info">'
        +'<div class="route-option-name">'+names[i]+' <span class="route-option-tag">'+tag+'</span></div>'
        +'<div class="route-option-stats"><span>📏 '+mi+' mi</span><span>⏱ '+tStr+'</span></div>'
        +'<span class="route-badge badge-checking" id="rb'+i+'">⏳ Checking weather…</span>'
      +'</div>'
      +'<div class="route-chevron">›</div>';
    c.appendChild(el);
  });
}

function selectRoute(idx) {
  routeCoords=allRoutes[idx]._coords;
  routeLayers.forEach((l,i)=>{
    l.line.setStyle({weight:i===idx?5:3,opacity:i===idx?0.9:0.3});
    l.glow.setStyle({opacity:i===idx?0.12:0.04});
  });
  if(routeLayers[idx]) routeLayers[idx].line.bringToFront();
  allRoutes.forEach((_,i)=>{
    const el=document.getElementById('ro'+i);
    if(!el) return;
    el.classList.toggle('selected',i===idx);
    el.style.borderColor=i===idx?COLORS[i]:'#1e2430';
  });
}

async function checkRouteWeather(coords,idx,dest) {
  const step=Math.max(1,Math.floor(coords.length/4));
  const pts=[];
  for(let i=0;i<coords.length;i+=step) pts.push(coords[i]);
  pts.push([dest.lat,dest.lng]);
  let maxCode=0;
  for(const pt of pts){
    try{
      const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+pt[0]+'&longitude='+pt[1]+'&current=weather_code&timezone=auto');
      const d=await r.json();
      if(d.current.weather_code>maxCode) maxCode=d.current.weather_code;
      if(d.current.weather_code>=95){
        const el=document.createElement('div'); el.className='storm-pulse';
        L.marker(pt,{icon:L.divIcon({className:'',html:el.outerHTML,iconSize:[40,40]})}).addTo(map);
      }
    }catch(e){}
  }
  const b=document.getElementById('rb'+idx);
  if(!b) return;
  if(maxCode>=95){b.className='route-badge badge-danger';b.textContent='⛈ Thunderstorms';}
  else if(maxCode>=80){b.className='route-badge badge-warn';b.textContent='🌧 Rain showers';}
  else if(maxCode>=61){b.className='route-badge badge-warn';b.textContent='🌦 Light rain';}
  else{b.className='route-badge badge-clear';b.textContent='✓ Clear';}
}

function clearRouteLayers(){
  routeLayers.forEach(l=>{map.removeLayer(l.line);map.removeLayer(l.glow);});
  routeLayers=[];allRoutes=[];routeCoords=[];
}
function clearRoute(){
  clearRouteLayers();
  if(startMarker){map.removeLayer(startMarker);startMarker=null;}
  if(endMarker){map.removeLayer(endMarker);endMarker=null;}
  stopNav();
  document.getElementById('routeOptionsSection').style.display='none';
  document.getElementById('routeForm').style.display='block';
}

// ── WEATHER ──
function wmoCode(c){
  const m={0:['☀️','Clear'],1:['🌤','Mainly Clear'],2:['⛅','Partly Cloudy'],3:['☁️','Overcast'],45:['🌫','Foggy'],48:['🌫','Icy Fog'],51:['🌦','Light Drizzle'],53:['🌦','Drizzle'],55:['🌧','Heavy Drizzle'],61:['🌧','Light Rain'],63:['🌧','Rain'],65:['🌧','Heavy Rain'],71:['🌨','Light Snow'],73:['❄️','Snow'],75:['❄️','Heavy Snow'],77:['🌨','Snow Grains'],80:['🌦','Light Showers'],81:['🌧','Showers'],82:['⛈','Heavy Showers'],95:['⛈','Thunderstorm'],96:['⛈','T-storm+Hail'],99:['⛈','Heavy T-storm']};
  return m[c]||['🌡','Unknown'];
}
async function fetchWeather(lat,lng){
  try{
    const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng+'&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,visibility&hourly=temperature_2m,precipitation_probability,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto&forecast_days=1';
    const res=await fetch(url);
    const d=await res.json();
    const c=d.current;
    const [icon,desc]=wmoCode(c.weather_code);
    document.getElementById('weatherHero').innerHTML='<div class="weather-hero"><div><div class="hero-temp">'+Math.round(c.temperature_2m)+'°</div><div class="hero-desc">'+desc+'</div><div class="hero-feels">Feels like '+Math.round(c.apparent_temperature)+'°F</div></div><div class="hero-icon">'+icon+'</div></div>';
    const sg=document.getElementById('wstatsGrid');
    sg.style.display='grid';
    sg.innerHTML='<div class="wstat"><div class="wstat-icon">💨</div><div class="wstat-val">'+c.wind_speed_10m+'</div><div class="wstat-key">Wind mph</div></div><div class="wstat"><div class="wstat-icon">🌬</div><div class="wstat-val">'+c.wind_gusts_10m+'</div><div class="wstat-key">Gusts mph</div></div><div class="wstat"><div class="wstat-icon">🌧</div><div class="wstat-val">'+c.precipitation+'"</div><div class="wstat-key">Precip</div></div>';
    const now=new Date();
    const fr=document.getElementById('forecastRow');
    fr.innerHTML='';
    let count=0;
    for(let i=0;i<d.hourly.time.length&&count<8;i++){
      const t=new Date(d.hourly.time[i]);
      if(t<now)continue;
      const [hi]=wmoCode(d.hourly.weather_code[i]);
      const hr=t.getHours();
      const lbl=hr===0?'12am':hr<12?hr+'am':hr===12?'12pm':(hr-12)+'pm';
      fr.innerHTML+='<div class="fc-card"><div class="fc-time">'+lbl+'</div><div class="fc-icon">'+hi+'</div><div class="fc-temp">'+Math.round(d.hourly.temperature_2m[i])+'°</div><div class="fc-precip">'+d.hourly.precipitation_probability[i]+'%💧</div></div>';
      count++;
    }
    document.getElementById('forecastWrap').style.display='block';
    generateAlerts(c,d.hourly,now);
  }catch(e){}
}
function generateAlerts(c,h,now){
  const alerts=[];
  if(c.weather_code>=95) alerts.push({t:'danger',i:'⛈',title:'ACTIVE THUNDERSTORM',text:'Severe thunderstorm at your location. Consider delaying travel.'});
  else if(c.weather_code>=80) alerts.push({t:'warn',i:'🌧',title:'RAIN SHOWERS',text:'Heavy showers in your area. Reduce speed and increase following distance.'});
  if(c.wind_gusts_10m>45) alerts.push({t:'danger',i:'💨',title:'HIGH WIND WARNING',text:'Gusts to '+c.wind_gusts_10m+' mph. Hazardous for high-profile vehicles.'});
  else if(c.wind_speed_10m>30) alerts.push({t:'warn',i:'💨',title:'STRONG WINDS',text:'Wind at '+c.wind_speed_10m+' mph. Take care on exposed highways.'});
  if(c.visibility&&c.visibility<1000) alerts.push({t:'danger',i:'🌫',title:'LOW VISIBILITY',text:'Visibility under 1km. Use fog lights and slow down.'});
  for(let i=0;i<h.time.length;i++){
    const diff=(new Date(h.time[i])-now)/3600000;
    if(diff>0&&diff<=3&&h.weather_code[i]>=95&&c.weather_code<95){alerts.push({t:'warn',i:'⚡',title:'STORM APPROACHING',text:'Thunderstorms in ~'+Math.round(diff*60)+' min. Plan ahead.'});break;}
  }
  if(!alerts.length) alerts.push({t:'ok',i:'✓',title:'CONDITIONS CLEAR',text:'No significant weather hazards detected.'});
  document.getElementById('alertsList').innerHTML=alerts.map(a=>'<div class="alert-card alert-'+a.t+'"><div class="alert-icon">'+a.i+'</div><div class="alert-body"><div class="alert-title">'+a.title+'</div><div class="alert-text">'+a.text+'</div></div></div>').join('');
  document.getElementById('alertsWrap').style.display='block';
}

// ── NAVIGATION ──
const TURNS=[{a:'↑',t:'Continue straight'},{a:'↗',t:'Keep right at fork'},{a:'→',t:'Turn right ahead'},{a:'↑',t:'Merge onto highway'},{a:'↖',t:'Keep left, take ramp'},{a:'←',t:'Turn left ahead'},{a:'🏁',t:'Arriving at destination'}];

function startNavigation(){
  if(!routeCoords.length){ showToast('Select a route first','warn'); return; }
  navMode=true; navStep=0;
  document.getElementById('navBar').classList.add('active');
  document.getElementById('startNavBtn').classList.add('hidden');
  updateNavStep();
  navWeatherTimer=setInterval(function(){
    const idx=Math.min(Math.floor((navStep/TURNS.length)*(routeCoords.length-1)),routeCoords.length-1);
    fetchWeather(routeCoords[idx][0],routeCoords[idx][1]);
    showToast('🌡 Weather updated');
  },180000);
  navTimer=setInterval(function(){
    navStep++;
    if(navStep>=TURNS.length){stopNav();showToast('🏁 You have arrived!');return;}
    updateNavStep();
    document.getElementById('progressFill').style.width=(navStep/(TURNS.length-1)*100)+'%';
  },15000);
}
function updateNavStep(){
  const t=TURNS[Math.min(navStep,TURNS.length-1)];
  document.getElementById('turnText').textContent=t.t;
  document.getElementById('turnArrow').textContent=t.a;
  const m=(TURNS.length-navStep-1)*2;
  document.getElementById('turnDist').textContent=m>0?'~'+m+' min remaining · live weather':'Arriving soon';
}
function stopNav(){
  navMode=false;
  clearInterval(navTimer);clearInterval(navWeatherTimer);
  document.getElementById('navBar').classList.remove('active');
  document.getElementById('startNavBtn').classList.remove('hidden');
  document.getElementById('progressFill').style.width='0%';
}

// ── UTILS ──
function showLoading(t){document.getElementById('loadingOverlay').classList.add('active');document.getElementById('loadingText').textContent=t||'Loading…';}
function setLoadingText(t){document.getElementById('loadingText').textContent=t;}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('active');}
function showToast(msg,type,dur){
  dur=dur||3000;
  const c=document.getElementById('toastContainer');
  const el=document.createElement('div');
  el.className='toast'; el.textContent=msg;
  c.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';},dur-400);
  setTimeout(()=>{el.remove();},dur);
}
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
// Auto-init on DOM ready
document.addEventListener('DOMContentLoaded', function() {
  loadRadar();
  updateClock(); setInterval(updateClock, 1000);
  document.getElementById('destination').addEventListener('keydown', function(e){if(e.key==='Enter') getRoute();});
  document.getElementById('mapDest').addEventListener('keydown', function(e){if(e.key==='Enter') startQuickRoute();});
  document.getElementById('origin').addEventListener('keydown', function(e){if(e.key==='Enter') document.getElementById('destination').focus();});
});
</script>
