<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StormNav">
<meta name="theme-color" content="#0a0c10">
<!-- PWA icons (fallback) -->
<link rel="apple-touch-icon" href="https://via.placeholder.com/180x180/0a0c10/00e5ff?text=⛈">
<title>StormNav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --panel: #161a22;
    --border: #1e2430;
    --accent: #00e5ff;
    --accent2: #ff6b35;
    --warn: #ffcc00;
    --danger: #ff3b3b;
    --ok: #00e676;
    --text: #e8eaf0;
    --muted: #5a6070;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --safe-top: env(safe-area-inset-top, 44px);
    --safe-bottom: env(safe-area-inset-bottom, 20px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --tab-bar-height: 64px;
    --header-height: 56px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    /* Prevent bounce scroll on iOS */
    position: fixed;
    width: 100%;
  }

  /* ── STATUS BAR SPACER ── */
  .status-bar-spacer {
    height: var(--safe-top);
    background: var(--surface);
    flex-shrink: 0;
  }

  /* ── HEADER ── */
  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    height: var(--header-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 100;
  }
  .logo {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logo span { color: var(--text); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .gps-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 0.6rem;
    color: var(--muted);
  }
  .gps-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 5px var(--ok); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .header-time { font-size: 0.65rem; color: var(--muted); }

  /* ── MAIN CONTENT AREA ── */
  .app-content {
    flex: 1;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  /* ── TAB VIEWS ── */
  .tab-view { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; }
  .tab-view.active { display: flex; }

  /* ── MAP TAB ── */
  #map { flex: 1; position: relative; min-height: 0; }
  #mapEl { width: 100%; height: 100%; }

  /* Map search bar overlay */
  .map-search-bar {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 500;
    display: flex;
    gap: 8px;
  }
  .map-search-input {
    flex: 1;
    background: rgba(17,19,24,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    outline: none;
  }
  .map-search-input::placeholder { color: var(--muted); }
  .map-fab {
    background: var(--accent);
    border: none;
    border-radius: 12px;
    width: 44px;
    height: 44px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(0,229,255,0.3);
  }

  /* Map bottom sheet */
  .map-bottom-sheet {
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 0 16px 8px;
    flex-shrink: 0;
    max-height: 60vh;
    overflow-y: auto;
  }
  .map-bottom-sheet::-webkit-scrollbar { display: none; }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 10px auto 14px;
  }

  /* Map controls */
  .map-controls-right {
    position: absolute;
    right: 12px;
    bottom: 12px;
    z-index: 400;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .map-icon-btn {
    width: 44px; height: 44px;
    background: rgba(17,19,24,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .map-icon-btn.active { border-color: var(--accent); color: var(--accent); }

  /* ── ROUTE SHEET ── */
  .route-inputs { margin-bottom: 12px; }
  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .input-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot-start { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot-end { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
  .route-input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .route-input:focus { border-color: var(--accent); }
  .route-input::placeholder { color: var(--muted); }
  .input-connector {
    width: 10px;
    display: flex;
    justify-content: center;
    flex-shrink: 0;
  }
  .connector-line { width: 1px; height: 20px; background: var(--border); }

  .btn-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .btn-primary {
    flex: 1;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-primary:active { opacity: 0.8; transform: scale(0.98); }
  .btn-sq {
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 46px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-sq:active { opacity: 0.7; }

  /* Route options */
  .route-options { display: flex; flex-direction: column; gap: 8px; }
  .route-option {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.15s;
  }
  .route-option:active { transform: scale(0.98); }
  .route-option.selected { border-width: 2px; }
  .route-color-bar { width: 4px; height: 42px; border-radius: 2px; flex-shrink: 0; }
  .route-option-info { flex: 1; min-width: 0; }
  .route-option-name { font-family: var(--font-display); font-size: 0.8rem; font-weight: 700; color: var(--text); }
  .route-option-tag { font-size: 0.65rem; color: var(--muted); font-weight: 400; }
  .route-option-stats { font-size: 0.65rem; color: var(--muted); margin: 3px 0 6px; display: flex; gap: 12px; }
  .route-badge { font-size: 0.6rem; padding: 3px 8px; border-radius: 20px; font-weight: 700; display: inline-block; }
  .badge-clear { background: rgba(0,230,118,0.15); color: var(--ok); }
  .badge-warn { background: rgba(255,204,0,0.15); color: var(--warn); }
  .badge-danger { background: rgba(255,59,59,0.15); color: var(--danger); }
  .badge-checking { background: rgba(90,96,112,0.2); color: var(--muted); }
  .route-chevron { color: var(--muted); font-size: 1rem; }
  .route-option.selected .route-chevron { color: var(--accent); }

  /* Nav progress bar */
  .nav-bar {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: none;
    flex-shrink: 0;
  }
  .nav-bar.active { display: block; }
  .nav-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .nav-label { font-family: var(--font-display); font-size: 0.75rem; font-weight: 700; color: var(--ok); }
  .nav-stop { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-family: var(--font-mono); font-size: 0.6rem; color: var(--muted); cursor: pointer; }
  .progress-track { background: var(--border); border-radius: 3px; height: 3px; margin-bottom: 10px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok)); border-radius: 3px; transition: width 0.5s; width: 0%; }
  .nav-turn { display: flex; align-items: center; gap: 10px; }
  .turn-icon { font-size: 1.6rem; flex-shrink: 0; }
  .turn-text { font-size: 0.75rem; color: var(--text); }
  .turn-sub { font-size: 0.62rem; color: var(--accent); margin-top: 2px; }

  /* ── WEATHER TAB ── */
  .weather-scroll { flex: 1; overflow-y: auto; padding: 16px; }
  .weather-scroll::-webkit-scrollbar { display: none; }

  .section-title {
    font-family: var(--font-display);
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
    margin-top: 16px;
  }
  .section-title:first-child { margin-top: 0; }

  .weather-hero {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .hero-temp { font-family: var(--font-display); font-size: 3rem; font-weight: 800; line-height: 1; }
  .hero-desc { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
  .hero-feels { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
  .hero-icon { font-size: 3.5rem; }

  .weather-stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  .wstat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .wstat-icon { font-size: 1.2rem; margin-bottom: 4px; }
  .wstat-val { font-family: var(--font-display); font-size: 0.9rem; font-weight: 700; color: var(--text); }
  .wstat-key { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

  .alerts-list { display: flex; flex-direction: column; gap: 8px; }
  .alert-card {
    border-radius: 12px;
    padding: 12px 14px;
    border-left: 3px solid;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    animation: alertIn 0.3s ease;
  }
  @keyframes alertIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .alert-warn { background: rgba(255,204,0,0.08); border-color: #ffcc00; }
  .alert-danger { background: rgba(255,59,59,0.1); border-color: #ff3b3b; }
  .alert-ok { background: rgba(0,230,118,0.07); border-color: #00e676; }
  .alert-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
  .alert-body { flex: 1; }
  .alert-title { font-family: var(--font-display); font-weight: 700; font-size: 0.75rem; margin-bottom: 2px; }
  .alert-text { font-size: 0.68rem; color: var(--muted); line-height: 1.5; }

  .forecast-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .forecast-scroll::-webkit-scrollbar { display: none; }
  .fc-card {
    flex-shrink: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    text-align: center;
    min-width: 68px;
  }
  .fc-time { font-size: 0.6rem; color: var(--muted); margin-bottom: 5px; }
  .fc-icon { font-size: 1.3rem; margin-bottom: 4px; }
  .fc-temp { font-size: 0.8rem; font-weight: 700; }
  .fc-precip { font-size: 0.6rem; color: #7ecfff; margin-top: 3px; }

  /* ── BOTTOM TAB BAR ── */
  .tab-bar {
    background: rgba(17,19,24,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    height: calc(var(--tab-bar-height) + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    flex-shrink: 0;
    z-index: 200;
  }
  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 0;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s;
  }
  .tab-btn:active { opacity: 0.6; }
  .tab-icon { font-size: 1.3rem; transition: transform 0.2s; }
  .tab-label { font-family: var(--font-mono); font-size: 0.58rem; color: var(--muted); transition: color 0.2s; letter-spacing: 0.05em; }
  .tab-btn.active .tab-icon { transform: scale(1.1); }
  .tab-btn.active .tab-label { color: var(--accent); }

  /* ── LOADING OVERLAY ── */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,12,16,0.85);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9000;
  }
  .loading-overlay.active { display: flex; }
  .loading-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 32px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .loading-text { font-size: 0.7rem; color: var(--muted); }

  /* ── TOAST ── */
  .toast-container { position: fixed; top: calc(var(--safe-top) + 70px); left: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .toast {
    background: rgba(22,26,34,0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 0.72rem;
    color: var(--text);
    max-width: 320px;
    text-align: center;
    animation: toastIn 0.3s ease;
    transition: opacity 0.4s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  @keyframes toastIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:none} }

  /* ── LEAFLET OVERRIDES ── */
  .leaflet-container { background: #0d1117 !important; }
  .leaflet-tile { filter: brightness(0.7) saturate(0.6) hue-rotate(195deg); }
  .leaflet-control-zoom { display: none; }
  .leaflet-control-attribution { font-size: 9px; }

  /* Storm pulse */
  .storm-pulse { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,59,59,0.2); border: 2px solid #ff3b3b; animation: stormPulse 1.5s ease-out infinite; }
  @keyframes stormPulse { 0%{transform:scale(1);opacity:1} 100%{transform:scale(2.5);opacity:0} }

  .placeholder-msg { color: var(--muted); font-size: 0.72rem; text-align: center; padding: 24px 16px; line-height: 1.9; }
</style>
</head>
<body>

<!-- Status bar spacer for iOS notch -->
<div class="status-bar-spacer"></div>

<!-- Header -->
<header class="app-header">
  <div class="logo">⛈ Storm<span>Nav</span></div>
  <div class="header-right">
    <div class="gps-pill">
      <div class="gps-dot" id="gpsDot"></div>
      <span id="gpsStatus">locating</span>
    </div>
    <span class="header-time" id="clock"></span>
  </div>
</header>

<!-- Main content -->
<div class="app-content">

  <!-- ── MAP TAB ── -->
  <div class="tab-view active" id="tabMap">
    <div style="flex:1;position:relative;min-height:0">
      <!-- Search bar overlay -->
      <div class="map-search-bar" id="mapSearchBar">
        <input class="map-search-input" id="mapDest" placeholder="🔍 Where to?" />
        <button class="map-fab" onclick="startQuickRoute()">↗</button>
      </div>
      <!-- Map -->
      <div id="mapEl" style="position:absolute;inset:0"></div>
      <!-- Map controls -->
      <div class="map-controls-right">
        <button class="map-icon-btn active" id="radarBtn" onclick="toggleWeatherLayer()" title="Radar">🌧</button>
        <button class="map-icon-btn" onclick="locateMe()" title="My Location">📍</button>
      </div>
    </div>

    <!-- Bottom sheet: route options + nav -->
    <div class="map-bottom-sheet" id="mapSheet">
      <div class="sheet-handle"></div>

      <!-- Nav bar -->
      <div class="nav-bar" id="navBar">
        <div class="nav-top">
          <span class="nav-label">🟢 NAVIGATING</span>
          <button class="nav-stop" onclick="stopNav()">END ROUTE</button>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="nav-turn">
          <div class="turn-icon" id="turnArrow">↑</div>
          <div>
            <div class="turn-text" id="turnText">Continue on current route</div>
            <div class="turn-sub" id="turnDist">Weather updates live</div>
          </div>
        </div>
      </div>

      <!-- Route form -->
      <div id="routeForm">
        <div class="route-inputs">
          <div class="input-row">
            <div class="input-dot dot-start"></div>
            <input class="route-input" id="origin" placeholder="From: your location or address" />
            <button class="btn-sq" onclick="useMyLocation()" style="height:42px;font-size:0.8rem">📍</button>
          </div>
          <div class="input-row" style="margin-left:14px">
            <div class="connector-line"></div>
          </div>
          <div class="input-row">
            <div class="input-dot dot-end"></div>
            <input class="route-input" id="destination" placeholder="To: destination" />
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-primary" onclick="getRoute()">GET ROUTES</button>
          <button class="btn-sq" onclick="clearRoute()">✕</button>
        </div>
      </div>

      <!-- Route options (shown after search) -->
      <div id="routeOptionsSection" style="display:none">
        <div class="section-title">Choose a Route</div>
        <div class="route-options" id="routeOptions"></div>
        <div style="margin-top:12px;margin-bottom:4px">
          <button class="btn-primary" id="startNavBtn" onclick="startNavigation()">▶ START NAVIGATION</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── WEATHER TAB ── -->
  <div class="tab-view" id="tabWeather">
    <div class="weather-scroll">
      <div class="section-title">Current Conditions</div>
      <div id="weatherHero">
        <div class="placeholder-msg">Get a route to see weather<br>conditions along your drive ⛅</div>
      </div>

      <div id="weatherStatsRow" class="weather-stats-row" style="display:none"></div>

      <div id="alertsWrap" style="display:none">
        <div class="section-title" style="margin-top:16px">Alerts</div>
        <div class="alerts-list" id="alertsList"></div>
      </div>

      <div id="forecastWrap" style="display:none">
        <div class="section-title" style="margin-top:16px">Hourly Forecast</div>
        <div class="forecast-scroll" id="forecastRow"></div>
      </div>
    </div>
  </div>

</div>

<!-- Tab Bar -->
<nav class="tab-bar">
  <button class="tab-btn active" id="tabBtnMap" onclick="switchTab('map')">
    <div class="tab-icon">🗺</div>
    <div class="tab-label">MAP</div>
  </button>
  <button class="tab-btn" id="tabBtnWeather" onclick="switchTab('weather')">
    <div class="tab-icon">⛅</div>
    <div class="tab-label">WEATHER</div>
  </button>
</nav>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Loading...</div>
  </div>
</div>

<!-- Toasts -->
<div class="toast-container" id="toastContainer"></div>

<script>
document.addEventListener("DOMContentLoaded", function() {
// ═══════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tabBtn' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  if (tab === 'map') setTimeout(() => map.invalidateSize(), 50);
}

// ═══════════════════════════════════════════
// MAP
// ═══════════════════════════════════════════
const map = L.map('mapEl', { center: [39.8, -98.5], zoom: 5, zoomControl: false, attributionControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM', maxZoom: 19 }).addTo(map);

let weatherLayerActive = true, weatherLayer = null;
async function loadWeatherLayer() {
  try {
    const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
    const d = await res.json();
    const latest = d.radar.past[d.radar.past.length - 1];
    if (weatherLayer) map.removeLayer(weatherLayer);
    if (weatherLayerActive) weatherLayer = L.tileLayer('https://tilecache.rainviewer.com' + latest.path + '/256/{z}/{x}/{y}/2/1_1.png', { opacity: 0.55, zIndex: 200 }).addTo(map);
  } catch(e) {}
}
function toggleWeatherLayer() {
  weatherLayerActive = !weatherLayerActive;
  document.getElementById('radarBtn').classList.toggle('active', weatherLayerActive);
  if (weatherLayerActive) loadWeatherLayer(); else if (weatherLayer) map.removeLayer(weatherLayer);
}
loadWeatherLayer();
setInterval(loadWeatherLayer, 300000);
window.addEventListener('load', () => setTimeout(() => map.invalidateSize(), 300));

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let userLat = null, userLng = null;
let routeLayers = [], allRoutes = [], routeCoords = [];
let startMarker = null, endMarker = null, selectedRouteIdx = 0;
let navMode = false, navSimInterval = null, navStep = 0, weatherRefreshInterval = null;
const ROUTE_COLORS = ['#00e5ff', '#ff6b35', '#a78bfa'];

// ═══════════════════════════════════════════
// GPS
// ═══════════════════════════════════════════
function locateMe() {
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude; userLng = pos.coords.longitude;
    map.setView([userLat, userLng], 14);
    document.getElementById('gpsStatus').textContent = 'active';
    document.getElementById('gpsDot').style.background = '#00e676';
    fetchWeather(userLat, userLng);
    showToast('📍 Location found');
  }, () => {
    document.getElementById('gpsStatus').textContent = 'unavailable';
    document.getElementById('gpsDot').style.background = '#ff3b3b';
    showToast('GPS unavailable — type an address', 'warn');
  });
}
function useMyLocation() {
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude; userLng = pos.coords.longitude;
    document.getElementById('origin').value = userLat.toFixed(5) + ', ' + userLng.toFixed(5);
    showToast('📍 Using your location');
  }, () => showToast('GPS unavailable', 'warn'));
}
navigator.geolocation.getCurrentPosition(pos => {
  userLat = pos.coords.latitude; userLng = pos.coords.longitude;
  map.setView([userLat, userLng], 12);
  document.getElementById('gpsStatus').textContent = 'active';
  fetchWeather(userLat, userLng);
}, () => { document.getElementById('gpsStatus').textContent = 'off'; document.getElementById('gpsDot').style.background = '#ff3b3b'; });

// ═══════════════════════════════════════════
// GEOCODE
// ═══════════════════════════════════════════
async function geocode(q) {
  const ll = q.match(/^(-?\d+\.?\d*),\s*(-?\d+\.?\d*)$/);
  if (ll) return { lat: parseFloat(ll[1]), lng: parseFloat(ll[2]), name: q };
  const res = await fetch('https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(q) + '&format=json&limit=1', { headers: { 'Accept-Language': 'en' } });
  const data = await res.json();
  if (!data.length) throw new Error('Not found: ' + q);
  return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), name: data[0].display_name };
}

// Quick route from map search bar
async function startQuickRoute() {
  const dest = document.getElementById('mapDest').value.trim();
  if (!dest) return;
  if (!userLat) { showToast('Enable GPS or enter origin in route planner', 'warn'); return; }
  document.getElementById('origin').value = userLat.toFixed(5) + ', ' + userLng.toFixed(5);
  document.getElementById('destination').value = dest;
  document.getElementById('mapDest').value = '';
  await getRoute();
}

// ═══════════════════════════════════════════
// ROUTING
// ═══════════════════════════════════════════
async function getRoute() {
  const ov = document.getElementById('origin').value.trim();
  const dv = document.getElementById('destination').value.trim();
  if (!ov || !dv) { showToast('Enter origin and destination', 'warn'); return; }
  showLoading('Finding routes...');
  clearRouteLayers();
  try {
    const [start, end] = await Promise.all([geocode(ov), geocode(dv)]);
    setLoadingText('Calculating...');
    const url = 'https://router.project-osrm.org/route/v1/driving/' + start.lng + ',' + start.lat + ';' + end.lng + ',' + end.lat + '?overview=full&geometries=geojson&steps=true&alternatives=true';
    const res = await fetch(url);
    const data = await res.json();
    if (data.code !== 'Ok') throw new Error('Routing failed');
    allRoutes = data.routes.sort((a,b) => a.duration - b.duration);
    allRoutes.forEach((r, i) => {
      const coords = r.geometry.coordinates.map(c => [c[1], c[0]]);
      r._coords = coords;
      const glow = L.polyline(coords, { color: ROUTE_COLORS[i], weight: 12, opacity: 0.07 }).addTo(map);
      const line = L.polyline(coords, { color: ROUTE_COLORS[i], weight: i === 0 ? 5 : 3, opacity: i === 0 ? 0.9 : 0.35, lineJoin: 'round' }).addTo(map);
      routeLayers.push({ glow, line });
    });
    map.fitBounds(L.latLngBounds(allRoutes.flatMap(r => r._coords)), { padding: [60, 60] });
    if (startMarker) map.removeLayer(startMarker);
    if (endMarker) map.removeLayer(endMarker);
    startMarker = L.circleMarker([start.lat, start.lng], { radius: 8, color: '#00e676', fillColor: '#00e676', fillOpacity: 1, weight: 2 }).addTo(map);
    endMarker = L.circleMarker([end.lat, end.lng], { radius: 8, color: '#ff6b35', fillColor: '#ff6b35', fillOpacity: 1, weight: 2 }).addTo(map);
    renderRouteOptions(allRoutes);
    selectRoute(0);
    setLoadingText('Checking weather...');
    await fetchWeather(start.lat, start.lng);
    allRoutes.forEach((r, i) => checkRouteWeather(r._coords, i, end));
    hideLoading();
    showToast(allRoutes.length + ' route' + (allRoutes.length > 1 ? 's' : '') + ' found');
    document.getElementById('routeForm').style.display = 'none';
    document.getElementById('routeOptionsSection').style.display = 'block';
  } catch(e) {
    hideLoading();
    showToast('Error: ' + e.message, 'danger');
  }
}

function renderRouteOptions(routes) {
  const container = document.getElementById('routeOptions');
  container.innerHTML = '';
  routes.forEach((r, i) => {
    const mi = (r.distance * 0.000621371).toFixed(1);
    const min = Math.round(r.duration / 60);
    const h = Math.floor(min/60), m = min%60;
    const tStr = h > 0 ? h + 'h ' + m + 'm' : m + ' min';
    const names = ['Fastest', 'Alternate', 'Third'];
    const diff = Math.round((r.duration - routes[0].duration) / 60);
    const tag = i === 0 ? '· Recommended' : '· +' + diff + ' min';
    const el = document.createElement('div');
    el.className = 'route-option' + (i === 0 ? ' selected' : '');
    el.id = 'ro' + i;
    el.style.borderColor = i === 0 ? ROUTE_COLORS[0] : '#1e2430';
    el.onclick = () => selectRoute(i);
    el.innerHTML = '<div class="route-color-bar" style="background:' + ROUTE_COLORS[i] + '"></div><div class="route-option-info"><div class="route-option-name">' + names[i] + ' <span class="route-option-tag">' + tag + '</span></div><div class="route-option-stats"><span>📏 ' + mi + ' mi</span><span>⏱ ' + tStr + '</span></div><span class="route-badge badge-checking" id="rb' + i + '">⏳ Checking...</span></div><div class="route-chevron">›</div>';
    container.appendChild(el);
  });
}

function selectRoute(idx) {
  selectedRouteIdx = idx;
  routeCoords = allRoutes[idx]._coords;
  routeLayers.forEach((l,i) => { l.line.setStyle({ weight: i===idx?5:3, opacity: i===idx?0.9:0.3 }); l.glow.setStyle({ opacity: i===idx?0.12:0.04 }); });
  if (routeLayers[idx]) routeLayers[idx].line.bringToFront();
  allRoutes.forEach((_, i) => {
    const el = document.getElementById('ro'+i);
    if (!el) return;
    el.classList.toggle('selected', i===idx);
    el.style.borderColor = i===idx ? ROUTE_COLORS[i] : '#1e2430';
  });
}

async function checkRouteWeather(coords, idx, dest) {
  const step = Math.max(1, Math.floor(coords.length / 4));
  const pts = [];
  for (let i = 0; i < coords.length; i += step) pts.push(coords[i]);
  pts.push([dest.lat, dest.lng]);
  let maxCode = 0;
  for (const pt of pts) {
    try {
      const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude='+pt[0]+'&longitude='+pt[1]+'&current=weather_code&timezone=auto');
      const d = await r.json();
      if (d.current.weather_code > maxCode) maxCode = d.current.weather_code;
      if (d.current.weather_code >= 95) {
        const el = document.createElement('div'); el.className = 'storm-pulse';
        L.marker(pt, { icon: L.divIcon({ className:'', html: el.outerHTML, iconSize:[40,40] }) }).addTo(map);
      }
    } catch(e) {}
  }
  const b = document.getElementById('rb'+idx);
  if (!b) return;
  if (maxCode >= 95) { b.className='route-badge badge-danger'; b.textContent='⛈ Thunderstorms'; }
  else if (maxCode >= 80) { b.className='route-badge badge-warn'; b.textContent='🌧 Rain showers'; }
  else if (maxCode >= 61) { b.className='route-badge badge-warn'; b.textContent='🌦 Light rain'; }
  else { b.className='route-badge badge-clear'; b.textContent='✓ Clear'; }
}

function clearRouteLayers() {
  routeLayers.forEach(l => { map.removeLayer(l.line); map.removeLayer(l.glow); });
  routeLayers=[]; allRoutes=[]; routeCoords=[];
  document.getElementById('routeOptionsSection').style.display='none';
  document.getElementById('routeForm').style.display='block';
}
function clearRoute() { clearRouteLayers(); if(startMarker) map.removeLayer(startMarker); if(endMarker) map.removeLayer(endMarker); stopNav(); }

// ═══════════════════════════════════════════
// WEATHER
// ═══════════════════════════════════════════
function wmoCode(c) {
  const m={0:['☀️','Clear'],1:['🌤','Mainly Clear'],2:['⛅','Partly Cloudy'],3:['☁️','Overcast'],45:['🌫','Foggy'],48:['🌫','Icy Fog'],51:['🌦','Light Drizzle'],53:['🌦','Drizzle'],55:['🌧','Heavy Drizzle'],61:['🌧','Light Rain'],63:['🌧','Rain'],65:['🌧','Heavy Rain'],71:['🌨','Light Snow'],73:['❄️','Snow'],75:['❄️','Heavy Snow'],77:['🌨','Snow Grains'],80:['🌦','Light Showers'],81:['🌧','Showers'],82:['⛈','Heavy Showers'],85:['🌨','Snow Showers'],86:['🌨','Heavy Snow Showers'],95:['⛈','Thunderstorm'],96:['⛈','T-storm + Hail'],99:['⛈','Heavy T-storm']};
  return m[c]||['🌡','Unknown'];
}
async function fetchWeather(lat, lng) {
  try {
    const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng+'&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,visibility&hourly=temperature_2m,precipitation_probability,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto&forecast_days=1';
    const res=await fetch(url);
    const d=await res.json();
    const c=d.current;
    const [icon,desc]=wmoCode(c.weather_code);
    document.getElementById('weatherHero').innerHTML='<div class="weather-hero"><div><div class="hero-temp">'+Math.round(c.temperature_2m)+'°</div><div class="hero-desc">'+desc+'</div><div class="hero-feels">Feels like '+Math.round(c.apparent_temperature)+'°F</div></div><div class="hero-icon">'+icon+'</div></div>';
    const sr=document.getElementById('weatherStatsRow');
    sr.style.display='grid';
    sr.innerHTML='<div class="wstat"><div class="wstat-icon">💨</div><div class="wstat-val">'+c.wind_speed_10m+'</div><div class="wstat-key">Wind mph</div></div><div class="wstat"><div class="wstat-icon">🌬</div><div class="wstat-val">'+c.wind_gusts_10m+'</div><div class="wstat-key">Gusts mph</div></div><div class="wstat"><div class="wstat-icon">🌧</div><div class="wstat-val">'+c.precipitation+'"</div><div class="wstat-key">Precip</div></div>';
    const now=new Date();
    const fr=document.getElementById('forecastRow');
    fr.innerHTML='';
    let count=0;
    for(let i=0;i<d.hourly.time.length&&count<8;i++){
      const t=new Date(d.hourly.time[i]);
      if(t<now)continue;
      const [hi]=wmoCode(d.hourly.weather_code[i]);
      const hr=t.getHours();
      const lbl=hr===0?'12am':hr<12?hr+'am':hr===12?'12pm':(hr-12)+'pm';
      fr.innerHTML+='<div class="fc-card"><div class="fc-time">'+lbl+'</div><div class="fc-icon">'+hi+'</div><div class="fc-temp">'+Math.round(d.hourly.temperature_2m[i])+'°</div><div class="fc-precip">'+d.hourly.precipitation_probability[i]+'%💧</div></div>';
      count++;
    }
    document.getElementById('forecastWrap').style.display='block';
    generateAlerts(c, d.hourly, now);
  } catch(e) {}
}
function generateAlerts(c, h, now) {
  const alerts=[];
  if(c.weather_code>=95) alerts.push({t:'danger',i:'⛈',title:'ACTIVE THUNDERSTORM',text:'Severe thunderstorm at your location. Consider delaying travel.'});
  else if(c.weather_code>=80) alerts.push({t:'warn',i:'🌧',title:'RAIN SHOWERS',text:'Heavy showers in your area. Reduce speed and increase following distance.'});
  if(c.wind_gusts_10m>45) alerts.push({t:'danger',i:'💨',title:'HIGH WIND WARNING',text:'Gusts to '+c.wind_gusts_10m+' mph. Hazardous for high-profile vehicles.'});
  else if(c.wind_speed_10m>30) alerts.push({t:'warn',i:'💨',title:'STRONG WINDS',text:'Wind at '+c.wind_speed_10m+' mph. Take care on exposed highways.'});
  if(c.visibility&&c.visibility<1000) alerts.push({t:'danger',i:'🌫',title:'LOW VISIBILITY',text:'Visibility under 1km. Use fog lights and slow down.'});
  for(let i=0;i<h.time.length;i++){
    const diff=(new Date(h.time[i])-now)/3600000;
    if(diff>0&&diff<=3&&h.weather_code[i]>=95&&c.weather_code<95){ alerts.push({t:'warn',i:'⚡',title:'STORM APPROACHING',text:'Thunderstorms in ~'+Math.round(diff*60)+' min. Plan ahead.'}); break; }
  }
  if(!alerts.length) alerts.push({t:'ok',i:'✓',title:'CONDITIONS CLEAR',text:'No significant weather hazards detected.'});
  const al=document.getElementById('alertsList');
  al.innerHTML=alerts.map(a=>'<div class="alert-card alert-'+a.t+'"><div class="alert-icon">'+a.i+'</div><div class="alert-body"><div class="alert-title">'+a.title+'</div><div class="alert-text">'+a.text+'</div></div></div>').join('');
  document.getElementById('alertsWrap').style.display='block';
}

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════
const TURNS=[{a:'↑',t:'Continue straight'},{a:'↗',t:'Keep right at the fork'},{a:'→',t:'Turn right ahead'},{a:'↑',t:'Merge onto highway'},{a:'↖',t:'Keep left, take ramp'},{a:'←',t:'Turn left ahead'},{a:'🏁',t:'Arriving at destination'}];
function startNavigation(){
  if(!routeCoords.length)return;
  navMode=true; navStep=0;
  document.getElementById('navBar').classList.add('active');
  document.getElementById('startNavBtn').style.display='none';
  document.getElementById('routeOptionsSection').querySelector('.route-options').style.opacity='0.4';
  updateNavStep();
  weatherRefreshInterval=setInterval(()=>{
    const idx=Math.min(Math.floor((navStep/TURNS.length)*(routeCoords.length-1)),routeCoords.length-1);
    fetchWeather(routeCoords[idx][0],routeCoords[idx][1]);
    showToast('🌡 Weather updated');
  },180000);
  navSimInterval=setInterval(()=>{
    navStep++;
    if(navStep>=TURNS.length){stopNav();showToast('🏁 Arrived!');return;}
    updateNavStep();
    document.getElementById('progressFill').style.width=(navStep/(TURNS.length-1)*100)+'%';
  },15000);
}
function updateNavStep(){
  const t=TURNS[Math.min(navStep,TURNS.length-1)];
  document.getElementById('turnText').textContent=t.t;
  document.getElementById('turnArrow').textContent=t.a;
  const m=(TURNS.length-navStep-1)*2;
  document.getElementById('turnDist').textContent=m>0?'~'+m+' min remaining · live weather':'Arriving soon';
}
function stopNav(){
  navMode=false;
  clearInterval(navSimInterval);clearInterval(weatherRefreshInterval);
  document.getElementById('navBar').classList.remove('active');
  document.getElementById('startNavBtn').style.display='block';
  const ro=document.getElementById('routeOptionsSection').querySelector('.route-options');
  if(ro) ro.style.opacity='1';
  document.getElementById('progressFill').style.width='0%';
}

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function showLoading(t){document.getElementById('loadingOverlay').classList.add('active');document.getElementById('loadingText').textContent=t||'Loading...';}
function setLoadingText(t){document.getElementById('loadingText').textContent=t;}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('active');}
function showToast(msg,type,dur){
  dur=dur||3000;
  const c=document.getElementById('toastContainer');
  const t=document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';},dur-400);
  setTimeout(()=>{t.remove();},dur);
}
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
updateClock();setInterval(updateClock,1000);
document.getElementById('destination').addEventListener('keydown',e=>{if(e.key==='Enter')getRoute();});
document.getElementById('mapDest').addEventListener('keydown',e=>{if(e.key==='Enter')startQuickRoute();});
}); // end DOMContentLoaded
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</body>
</html>
